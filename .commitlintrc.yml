# Enforces the Conventional Commits format documented in CODING_STANDARDS.md.
# Consumed by wagoid/commitlint-github-action in CI — no local Node install required.
extends:
  - "@commitlint/config-conventional"
rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
  scope-enum:
    - 2
    - always
    - - build
      - connectivity
      - midi
      - audio
      - ui
      - session
      - platform
      - docs
  subject-case:
    - 2
    - always
    - lower-case
