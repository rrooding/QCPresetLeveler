# Enforces the Conventional Commits format documented in CODING_STANDARDS.md.
# Consumed by wagoid/commitlint-github-action in CI — no local Node install required.
extends:
  - "@commitlint/config-conventional"
rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
  scope-enum:
    - 2
    - always
    - - build
      - connectivity
      - midi
      - audio
      - ui
      - session
      - platform
      - docs
  # config-conventional's default subject-case already forbids the subject as a whole
  # being Sentence case/Start Case/PascalCase/UPPERCASE, while still allowing embedded
  # acronyms and proper nouns (JUCE, CTest, GitHub Actions, ...) — don't override it with
  # a blanket lower-case rule, which flags every technical term with a capital letter.
